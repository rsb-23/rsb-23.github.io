name: Lint and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: rsb-23/actions/checkout@main

      - uses: actions/setup-node@v6
        with:
          node-version: 21
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: |
          npm run ci:icons
          npm run build

      - name: Deploy to GitHub Pages
        run: npm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
